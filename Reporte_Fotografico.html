<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Fotográfico de Daños</title>
    <style>
        :root {
            --ipn-guinda: #7A003C;
            --ipn-gray: #f2f2f2;
            --border-color: #ccc;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: #fff;
            color: #333;
        }

        .report-container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            border-bottom: 3px solid var(--ipn-guinda);
            margin-bottom: 20px;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--ipn-guinda);
            margin: 0;
            text-transform: uppercase;
        }

        .meta-info {
            font-size: 0.9rem;
            color: #666;
        }

        /* Table Styling */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .data-table th,
        .data-table td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: center;
            vertical-align: middle;
        }

        .data-table th {
            background-color: var(--ipn-guinda);
            color: white;
            font-weight: 600;
        }

        .data-table td input,
        .data-table td textarea {
            width: 100%;
            border: none;
            background: transparent;
            text-align: center;
            font-family: inherit;
        }

        .data-table td input:focus {
            outline: 2px solid var(--ipn-guinda);
            background: #fff0f5;
        }

        /* Photo Section */
        .photo-frame {
            width: 100%;
            height: 400px;
            border: 2px dashed #aaa;
            background-color: var(--ipn-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
        }

        .photo-frame span {
            color: #777;
            font-size: 1.2rem;
            pointer-events: none;
        }

        .photo-frame img {
            max-width: 100%;
            max-height: 100%;
            display: none;
            /* Hidden by default until image selected */
        }

        .file-input-wrapper {
            margin-bottom: 15px;
            text-align: right;
        }

        @media print {

            .file-input-wrapper,
            .main-nav {
                display: none;
            }

            body {
                padding: 0;
            }

            .photo-frame {
                border: 1px solid #000;
            }
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 1.2rem;
            }

            .report-container {
                width: 100%;
            }

            .data-table,
            .data-table tbody,
            .data-table tr,
            .data-table td,
            .data-table th {
                display: block;
                width: 100%;
                box-sizing: border-box;
            }

            .data-table thead {
                display: none;
            }

            .data-table tr {
                margin-bottom: 1rem;
                border: 1px solid #ddd;
                border-radius: 8px;
                padding: 10px;
                background: #f9f9f9;
            }

            .data-table td {
                border: none;
                border-bottom: 1px solid #eee;
                padding: 8px 0;
                text-align: left;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .data-table td:last-child {
                border-bottom: none;
            }

            .data-table td::before {
                content: attr(data-label);
                font-weight: bold;
                color: var(--ipn-guinda);
                font-size: 0.85rem;
                margin-right: 10px;
            }

            .data-table td input {
                text-align: right;
                width: 60%;
            }

            .main-nav {
                flex-wrap: wrap;
                display: flex;
                /* Ensure flex behavior */
                gap: 10px;
            }

            .main-nav a,
            .main-nav span {
                margin-right: 0 !important;
                font-size: 0.9rem;
            }

            .photo-frame {
                height: 250px;
            }
        }
    </style>
</head>

<body>

    <div class="report-container">
        <header>
            <div>
                <h1>Reporte Fotográfico</h1>
                <div>Cédula de Evaluación Estructural</div>
            </div>
            <div class="meta-info">
                Fecha: <span id="currentDate"></span><br>
                Folio: <strong>CED-TEMP-001</strong>
            </div>
        </header>

        <nav class="main-nav" style="margin-bottom: 2rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem;">
            <a href="index.html" style="margin-right: 15px; text-decoration: none; color: #555;">&larr; Inicio</a>
            <a href="Atencion.html" style="margin-right: 15px; text-decoration: none; color: #555;">Atención</a>
            <span style="font-weight: bold; color: var(--ipn-guinda);">Reporte Fotográfico</span>
        </nav>

        <div class="file-input-wrapper">
            <label for="imgUpload" style="cursor:pointer; color: var(--ipn-guinda); font-weight:bold;">
                [+ Cargar Fotografía]
            </label>
            <input type="file" id="imgUpload" accept="image/*" style="display:none;" onchange="previewImage(event)">
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th rowspan="2">Tipo de Falla</th>
                    <th rowspan="2">Columna Corta</th>
                    <th rowspan="2">Planta Baja</th>
                    <th rowspan="2">Nivel</th>
                    <th colspan="3">Ubicación</th>
                    <th rowspan="2">Fotografía No.</th>
                </tr>
                <tr>
                    <th>Sobre eje</th>
                    <th>entre ejes</th>
                    <th>y</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td data-label="Tipo de Falla"><input type="text" placeholder="Ej. Grieta cortante"></td>
                    <td data-label="Columna Corta"><input type="text" placeholder="Si/No"></td>
                    <td data-label="Planta Baja"><input type="text" placeholder="PB"></td>
                    <td data-label="Nivel"><input type="text" placeholder="1"></td>
                    <td data-label="Eje Principal"><input type="text" placeholder="A"></td>
                    <td data-label="Entre Ejes"><input type="text" placeholder="1"></td>
                    <td data-label="Y Eje"><input type="text" placeholder="2"></td>
                    <td data-label="Foto No."><input type="text" placeholder="#1"></td>
                </tr>
                <!-- Description Row -->
                <tr>
                    <th colspan="1" style="background:#eee; color:#333; text-align:right;">Descripción</th>
                    <td colspan="7">
                        <textarea rows="3" style="text-align:left; resize:vertical; padding:5px;"
                            placeholder="Describa detalladamente la falla observada..."></textarea>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="photo-frame" id="photoFrame">
            <span id="placeholderText">Sin imagen seleccionada</span>
            <img id="preview" src="" alt="Evidencia Fotográfica">
        </div>

    </div>

    <script>
        // Set date
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString();

        // Image Preview Logic
        function previewImage(event) {
            const input = event.target;
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById('preview').src = e.target.result;
                    document.getElementById('preview').style.display = 'block';
                    document.getElementById('placeholderText').style.display = 'none';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // PWA Register
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service-worker.js").catch(e => console.error(e));
            });
        }
    </script>

</body>

</html>
